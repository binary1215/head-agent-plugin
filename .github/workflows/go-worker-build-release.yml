      - "scripts/head.mjs"
      - "scripts/mcp-server.mjs"
      - "scripts/verify-go-worker.mjs"
      - "scripts/verify-onboarding.mjs"
      - "scripts/verify-conversational-onboarding.mjs"
      - "scripts/verify-arcadedb-database-lifecycle.mjs"
      - "scripts/verify-arcadedb-incremental-sync.mjs"
      - "skills/**"
      - ".mcp.json"
      - "README.md"
      - "assets/**"
